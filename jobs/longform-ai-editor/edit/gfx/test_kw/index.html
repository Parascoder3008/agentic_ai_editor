<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1920px; height: 1080px; font-family: Inter, sans-serif; }
      /* right: "right" sits on the clean wall to the right of the speaker; "left" / "center" also available */
      #box { position: absolute; top: 360px; width: 600px; right: 80px; text-align: left; }
      .kick { color: #3AB0D8; font-weight: 800; font-size: 30px; letter-spacing: 0.22em; text-transform: uppercase; margin-bottom: 10px; }
      .main { color: #FFFFFF; font-weight: 900; font-size: 96px; line-height: 0.98; letter-spacing: -0.035em;
        text-shadow: 0 6px 26px rgba(12,14,15,0.55); }
      .main .hl { position: relative; display: inline-block; padding: 0 14px; margin: 6px -14px 0; }
      .main .hl::before { content: ""; position: absolute; inset: 6% 0 4% 0; background: #1A9FD1; border-radius: 10px; z-index: -1;
        transform: scaleX(var(--hl, 0)); transform-origin: left center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="1.8" data-width="1920" data-height="1080">
      <div id="box" class="clip" data-start="0" data-duration="1.8" data-track-index="0">
        <div class="kick" id="kick">Step 1</div>
        <div class="main" id="main">Raw <span class="hl">footage</span> folder</div>
      </div>
    </div>
    <script>
      const DUR = 1.8;
      gsap.set("#box", { opacity: 0 });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#box", { opacity: 0, y: 30, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.28, ease: "back.out(2)" }, 0)
        .fromTo("#kick", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out" }, 0.08)
        .fromTo(".main .hl", { "--hl": 0 }, { "--hl": 1, duration: 0.3, ease: "power3.inOut" }, 0.18)
        .to("#box", { opacity: 0, y: -18, duration: 0.22, ease: "power2.in" }, DUR - 0.22);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
