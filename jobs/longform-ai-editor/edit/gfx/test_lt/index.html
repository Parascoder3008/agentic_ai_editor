<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800;900&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1920px; height: 1080px; font-family: Inter, sans-serif; }
      #lt { position: absolute; left: 90px; top: 840px; display: flex; align-items: stretch; }
      #acc { width: 12px; background: #1A9FD1; border-radius: 6px; transform-origin: center bottom; }
      #txt { padding: 16px 28px 18px; background: rgba(12,14,15,0.86); border-radius: 0 18px 18px 0; overflow: hidden; }
      #name { color: #FFFFFF; font-weight: 900; font-size: 50px; letter-spacing: 0.01em; line-height: 1.05; }
      #role { color: #DFDDDF; font-weight: 500; font-size: 26px; letter-spacing: 0.16em; margin-top: 4px; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.5" data-width="1920" data-height="1080">
      <div id="lt" class="clip" data-start="0" data-duration="3.5" data-track-index="0">
        <div id="acc"></div>
        <div id="txt"><div id="name">PARAS ARORA</div><div id="role">Founder ? Exponential World AI</div></div>
      </div>
    </div>
    <script>
      const DUR = 3.5;
      gsap.set("#lt", { opacity: 0 });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.set("#lt", { opacity: 1 }, 0)
        .fromTo("#acc", { scaleY: 0 }, { scaleY: 1, duration: 0.3, ease: "power3.out" }, 0)
        .fromTo("#txt", { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" }, 0.12)
        .to("#lt", { opacity: 0, x: -30, duration: 0.3, ease: "power2.in" }, DUR - 0.3);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
