<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,800;0,900;1,600&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1920px; height: 1080px; font-family: Inter, sans-serif; }
      #panel { position: absolute; left: 0; top: 0; width: 960px; height: 1080px; overflow: hidden;
        background: radial-gradient(ellipse at 50% 40%, #11324C 0%, #0C0E0F 70%);
        -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 80%, transparent 97%); mask-image: linear-gradient(to bottom, #000 0%, #000 80%, transparent 97%); }
      #line { position: absolute; left: 40px; right: 40px; top: 44px; text-align: center; line-height: 1.12; }
      .w { display: inline-block; margin: 0 9px; color: #FFFFFF; opacity: 0; }
      .w.i { font-style: italic; font-weight: 600; font-size: 54px; color: #DFDDDF; }
      .w.b { font-weight: 900; font-size: 62px; }
      .big { position: absolute; left: 0; right: 0; text-align: center; font-weight: 900; font-size: 196px;
        letter-spacing: -0.05em; line-height: 1; opacity: 0; }
      #big { top: 300px; color: #1A9FD1; }
      #big2 { top: 500px; color: transparent; -webkit-text-stroke: 4px #3AB0D8; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="1920" data-height="1080">
      <div id="panel" class="clip" data-start="0" data-duration="{{DUR}}" data-track-index="0">
        <div id="line"></div>
        <div class="big" id="big">CHHUTTI</div>
        <div class="big" id="big2">CHHUTTI</div>
      </div>
    </div>
    <script>
      const WORDS = {{WORDS}};          // [text, "i"|"b", time]
      const T_SLAM = {{T_SLAM}};        // slam lands (+0.16) on "chhutti"
      const DUR = {{DUR}};
      const line = document.getElementById("line");
      WORDS.forEach(([w, s], i) => { const e = document.createElement("span"); e.className = "w " + s; e.id = "w" + i; e.textContent = w; line.appendChild(e); });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      WORDS.forEach(([, , t], i) => tl.fromTo("#w" + i, { opacity: 0, y: 22, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.2, ease: "back.out(2)" }, t));
      tl.fromTo("#big", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power4.in" }, T_SLAM)
        .fromTo(["#line", "#big"], { x: 0 }, { x: 12, duration: 0.05, yoyo: true, repeat: 5, ease: "none" }, T_SLAM + 0.16)
        .fromTo("#big2", { opacity: 0, scale: 1.5 }, { opacity: 0.9, scale: 1, duration: 0.16, ease: "power4.in" }, T_SLAM + 0.32)
        .to("#panel", { opacity: 0, duration: 0.22, ease: "power2.in" }, DUR - 0.22);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
