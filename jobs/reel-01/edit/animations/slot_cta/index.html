<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,500;0,700;0,900;1,700&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1080px; height: 1920px; font-family: Inter, sans-serif; }
      #card { position: absolute; left: 0; right: 0; margin: 0 auto; width: 860px; top: 470px;
        padding: 40px 48px 44px; border-radius: 28px; background: rgba(17,50,76,0.92);
        border: 2px solid rgba(58,176,216,0.6); text-align: center; }
      #k { color: #DFDDDF; font-weight: 700; font-size: 34px; letter-spacing: 0.3em; }
      #word { display: inline-block; margin-top: 14px; padding: 6px 40px 12px; border-radius: 22px; background: #1A9FD1;
        color: #FFFFFF; font-weight: 900; font-size: 150px; letter-spacing: -0.02em; line-height: 1; }
      #sub { margin-top: 22px; color: #FFFFFF; font-weight: 500; font-size: 36px; }
      #sub i { font-weight: 700; color: #3AB0D8; }
      #cursor { position: absolute; left: 0; top: 0; width: 44px; height: 44px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1080" data-height="1920">
      <div id="card" class="clip" data-start="0" data-duration="4" data-track-index="0">
        <div id="k">COMMENT</div>
        <div id="word">EDIT</div>
        <div id="sub">Step-by-step guide + workflow <i>seedha aapke DM mein</i></div>
      </div>
    </div>
    <script>
      gsap.set("#card", { opacity: 0 });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#card", { opacity: 0, y: 60, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 0)
        .fromTo("#word", { scale: 0.6 }, { scale: 1, duration: 0.45, ease: "back.out(2.5)" }, 0.6)   // lands on spoken "EDIT" (0.83)
        .to("#word", { scale: 1.06, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 3 }, 1.15)
        .to("#card", { opacity: 0, y: -30, duration: 0.3, ease: "power2.in" }, 3.7);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
