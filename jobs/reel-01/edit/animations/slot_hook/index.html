<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,800;0,900;1,600;1,800&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1080px; height: 1920px; font-family: Inter, sans-serif; }
      #panel { position: absolute; left: 0; top: 0; width: 1080px; height: 960px; overflow: hidden;
        background: radial-gradient(ellipse at 50% 40%, #11324C 0%, #0C0E0F 70%); }
      #line { position: absolute; left: 40px; right: 40px; top: 50px; text-align: center; line-height: 1.1; }
      .w { display: inline-block; margin: 0 10px; color: #FFFFFF; opacity: 0; }
      .w.i { font-style: italic; font-weight: 600; font-size: 64px; color: #DFDDDF; }
      .w.b { font-weight: 900; font-size: 72px; }
      #big { position: absolute; left: 0; right: 0; top: 250px; text-align: center; font-weight: 900; font-size: 232px;
        letter-spacing: -0.05em; line-height: 1; color: #1A9FD1; opacity: 0; }
      #big2 { position: absolute; left: 0; right: 0; top: 480px; text-align: center; font-weight: 900; font-size: 232px;
        letter-spacing: -0.05em; line-height: 1; color: transparent; -webkit-text-stroke: 4px #3AB0D8; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.2" data-width="1080" data-height="1920">
      <div id="panel" class="clip" data-start="0" data-duration="3.2" data-track-index="0">
        <div id="line"></div>
        <div id="big">CHHUTTI</div>
        <div id="big2">CHHUTTI</div>
      </div>
    </div>
    <script>
      // [word, style, time (s from overlay start)] — times from the transcript
      const WORDS = [["Bhai,", "i", 0.05], ["maine", "i", 0.29], ["kar", "i", 0.65], ["diya", "i", 0.85], ["apne", "i", 1.0], ["video", "b", 1.26], ["editor", "b", 1.54], ["ki", "i", 1.88]];
      const T_SLAM = 1.86;   // slam lands (+0.16) exactly on "chhutti" at 2.02
      const line = document.getElementById("line");
      WORDS.forEach(([w, s], i) => { const e = document.createElement("span"); e.className = "w " + s; e.id = "w" + i; e.textContent = w; line.appendChild(e); });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      WORDS.forEach(([, , t], i) => tl.fromTo("#w" + i, { opacity: 0, y: 24, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.22, ease: "back.out(2)" }, t));
      tl.fromTo("#big", { opacity: 0, scale: 1.6 }, { opacity: 1, scale: 1, duration: 0.16, ease: "power4.in" }, T_SLAM)
        .fromTo(["#line", "#big"], { x: 0 }, { x: 14, duration: 0.05, yoyo: true, repeat: 5, ease: "none" }, T_SLAM + 0.16)
        .fromTo("#big2", { opacity: 0, scale: 1.5 }, { opacity: 0.9, scale: 1, duration: 0.16, ease: "power4.in" }, T_SLAM + 0.32)
        .to("#big", { scale: 1.04, duration: 1.5, ease: "none" }, T_SLAM + 0.16)
        .to("#big2", { scale: 1.04, duration: 1.3, ease: "none" }, T_SLAM + 0.48)
        .to("#panel", { opacity: 0, duration: 0.25, ease: "power2.in" }, 2.95);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
