<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800;900&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1080px; height: 1920px; font-family: Inter, sans-serif; }
      .chip { position: absolute; left: 0; right: 0; margin: 0 auto; width: fit-content; top: 690px; display: flex; align-items: center; gap: 20px;
        padding: 22px 34px; border-radius: 28px; background: rgba(17,50,76,0.94); border: 2px solid rgba(58,176,216,0.6); opacity: 0; }
      .ico { width: 64px; height: 64px; border-radius: 18px; background: #1A9FD1; display: flex; align-items: center; justify-content: center; }
      .ico svg { width: 38px; height: 38px; }
      .t1 { color: #FFFFFF; font-weight: 900; font-size: 40px; line-height: 1.1; }
      .t2 { color: #DFDDDF; font-weight: 500; font-size: 26px; margin-top: 4px; }
      .t2 b { color: #3AB0D8; font-weight: 800; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10.66" data-width="1080" data-height="1920">
      <div class="chip clip" id="c1" data-start="0" data-duration="10.66" data-track-index="0">
        <div class="ico"><svg viewBox="0 0 24 24"><path fill="#FFFFFF" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2c0 1.3.9 2.6 1.1 2.7.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg></div>
        <div><div class="t1">WhatsApp channel</div><div class="t2">Link in the <b>description</b></div></div>
      </div>
      <div class="chip clip" id="c2" data-start="0" data-duration="10.66" data-track-index="1">
        <div class="ico"><svg viewBox="0 0 24 24"><path fill="#FFFFFF" d="M8 5v14l11-7z"/></svg></div>
        <div><div class="t1">Full YouTube walkthrough</div><div class="t2">The <b>whole process</b>, step by step</div></div>
      </div>
      <div class="chip clip" id="c3" data-start="0" data-duration="10.66" data-track-index="2">
        <div class="ico"><svg viewBox="0 0 24 24"><path fill="#FFFFFF" d="M12 21s-7.5-4.6-9.5-9.2C1 8.3 3.4 5 6.8 5c2 0 3.6 1.1 5.2 3 1.6-1.9 3.2-3 5.2-3 3.4 0 5.8 3.3 4.3 6.8C19.5 16.4 12 21 12 21z"/></svg></div>
        <div><div class="t1">Follow + Subscribe</div><div class="t2">More <b>AI workflows</b> every week</div></div>
      </div>
    </div>
    <script>
      // overlay starts at output 81.50 s
      const CH = [["#c1", 0.19, 3.45], ["#c2", 3.57, 7.4], ["#c3", 8.0, 10.66]];  // "WhatsApp" | "YouTube" | "follow subscribe"
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      CH.forEach(([id, a, b]) => {
        tl.fromTo(id, { opacity: 0, y: 40, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.7)" }, a);
        if (b < 10.66) tl.to(id, { opacity: 0, y: -24, duration: 0.3, ease: "power2.in" }, b - 0.3);
      });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
