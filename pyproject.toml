[project]
name = "aie"
version = "0.1.0"
description = "AI Editor pipeline: one job.json per video, rendered by shared stages"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
# Later stages. validate, effects and doctor run on the standard library alone; cut needs numpy.
media = ["scipy", "soundfile", "pillow", "opencv-python"]
speech = ["faster-whisper", "torch", "torchaudio"]
qa = ["playwright"]

[tool.setuptools]
packages = ["aie"]

[tool.setuptools.package-data]
aie = ["hyperframes_base/*.json"]
