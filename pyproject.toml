[project]
name = "aie"
version = "0.1.0"
description = "AI Editor pipeline: one job.json per video, rendered by shared stages"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
# Later stages. validate, effects and doctor run on the standard library alone; cut needs numpy.
media = ["scipy", "soundfile", "pillow", "opencv-python"]
speech = ["faster-whisper", "torch", "torchaudio"]
qa = ["playwright"]
app = ["fastapi", "uvicorn", "python-multipart"]
agents = ["anthropic>=2.2"]          # the Claude API Tool Runner (beta) drives the agent team

[tool.setuptools]
packages = ["aie", "aie.app", "aie.agents"]

[tool.setuptools.package-data]
aie = ["hyperframes_base/*.json"]
"aie.agents" = ["primer.md"]
"aie.app" = ["static/*.html", "static/*.css", "static/js/*.js", "static/js/screens/*.js", "static/vendor/*"]
