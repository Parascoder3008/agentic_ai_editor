<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1920px; height: 1080px; font-family: Inter, sans-serif; }
      #card { position: absolute; right: 80px; top: 760px; display: flex; align-items: center; gap: 20px; padding: 18px 20px 18px 18px;
        border-radius: 26px; background: rgba(12,14,15,0.92); border: 1px solid rgba(58,176,216,0.35); }
      #av { width: 74px; height: 74px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #3AB0D8, #11324C);
        display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-weight: 900; font-size: 30px; }
      #nm { color: #FFFFFF; font-weight: 900; font-size: 32px; } #hd { color: #DFDDDF; font-weight: 700; font-size: 20px; margin-top: 2px; }
      #btn { position: relative; margin-left: 10px; padding: 16px 30px; border-radius: 999px; background: #1A9FD1; color: #FFFFFF; font-weight: 900; font-size: 28px; }
      #btn .on { position: absolute; inset: 0; border-radius: 999px; background: #11324C; color: #DFDDDF; display: flex; align-items: center; justify-content: center; opacity: 0; }
      #bell { width: 52px; height: 52px; border-radius: 50%; background: rgba(58,176,216,0.15); display: flex; align-items: center; justify-content: center; }
      #bell svg { width: 30px; height: 30px; }
      #cur { position: absolute; left: 0; top: 0; width: 42px; height: 42px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="1920" data-height="1080">
      <div id="card" class="clip" data-start="0" data-duration="{{DUR}}" data-track-index="0">
        <div id="av">P</div>
        <div><div id="nm">Paras Arora</div><div id="hd">@parasarora_ai</div></div>
        <div id="btn">Subscribe<div class="on">Subscribed ✓</div></div>
        <div id="bell"><svg viewBox="0 0 24 24"><path d="M12 22a2.4 2.4 0 0 0 2.4-2.4H9.6A2.4 2.4 0 0 0 12 22zm7-6V11a7 7 0 0 0-5.5-6.8V3.5a1.5 1.5 0 0 0-3 0v.7A7 7 0 0 0 5 11v5l-2 2v1h18v-1z" fill="#3AB0D8"/></svg></div>
      </div>
      <svg id="cur" class="clip" data-start="0" data-duration="{{DUR}}" data-track-index="1" viewBox="0 0 24 24"><path d="M3 2 L3 20 L8 15 L11.5 22 L14.5 20.6 L11 13.8 L18 13.8 Z" fill="#FFFFFF" stroke="#0C0E0F" stroke-width="1.4"/></svg>
    </div>
    <script>
      const DUR = {{DUR}};
      gsap.set("#card", { opacity: 0 }); gsap.set("#cur", { x: 1900, y: 1060, opacity: 0 });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#card", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, 0)
        .to("#cur", { opacity: 1, duration: 0.15 }, 0.5)
        .to("#cur", { x: 1640, y: 818, duration: 0.7, ease: "power2.inOut" }, 0.55)
        .to("#btn", { scale: 0.92, duration: 0.08, yoyo: true, repeat: 1 }, 1.3)
        .to("#btn .on", { opacity: 1, duration: 0.15 }, 1.4)
        .to("#cur", { x: 1782, y: 818, duration: 0.45, ease: "power2.inOut" }, 1.75)
        .fromTo("#bell svg", { rotation: 0 }, { rotation: 18, duration: 0.08, yoyo: true, repeat: 5, transformOrigin: "50% 10%" }, 2.25)
        .to("#cur", { opacity: 0, duration: 0.2 }, 2.9)
        .to("#card", { opacity: 0, y: 30, duration: 0.3, ease: "power2.in" }, DUR - 0.3);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
