<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { width: 100%; height: 100%; position: relative; font-family: Inter, sans-serif; }
      #card {
        position: absolute; left: 0; right: 0; margin: 0 auto; width: fit-content; top: 300px;
        padding: 36px 64px 44px; border-radius: 28px;
        background: rgba(17, 50, 76, 0.82); border: 1px solid rgba(58, 176, 216, 0.35);
        text-align: center;
      }
      #eyebrow { color: #DFDDDF; font-size: 30px; font-weight: 500; letter-spacing: 0.2em; }
      #word { color: #FFFFFF; font-size: 132px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
      #bar { height: 8px; border-radius: 4px; background: #1A9FD1; margin-top: 14px; transform-origin: left center; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.2" data-width="1920" data-height="1080">
      <div id="card" class="clip" data-start="0" data-duration="2.2" data-track-index="0">
        <div id="eyebrow">THING #1</div>
        <div id="word">MEMORY</div>
        <div id="bar"></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#card", { opacity: 0, y: 40, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "power3.out" }, 0)
        .fromTo("#eyebrow", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.15)
        .fromTo("#word", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, 0.3)
        .fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.inOut" }, 0.45)
        .to("#card", { opacity: 0, y: -20, duration: 0.3, ease: "power2.in" }, 1.9);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
