<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root { position: relative; width: 1920px; height: 1080px; font-family: Inter, sans-serif; }
      #panel { position: absolute; left: 1180px; top: 150px; width: 690px; padding: 34px 34px 38px; border-radius: 28px;
        background: rgba(12,14,15,0.9); border: 1px solid rgba(58,176,216,0.35); }
      #ttl { color: #3AB0D8; font-weight: 800; font-size: 26px; letter-spacing: 0.24em; margin-bottom: 6px; }
      #big { color: #FFFFFF; font-weight: 900; font-size: 64px; letter-spacing: -0.03em; margin-bottom: 22px; }
      .row { display: grid; grid-template-columns: 150px 1fr; align-items: center; gap: 18px; margin-top: 16px; opacity: 0.18; }
      .pct { font-weight: 900; font-size: 64px; letter-spacing: -0.04em; color: #FFFFFF; text-align: right; }
      .bar { position: relative; height: 92px; border-radius: 18px; background: rgba(17,50,76,0.7); overflow: hidden; }
      .fill { position: absolute; inset: 0; border-radius: 18px; transform-origin: left center; transform: scaleX(0); }
      .who { position: absolute; left: 20px; top: 12px; color: #FFFFFF; font-weight: 900; font-size: 30px; }
      .what { position: absolute; left: 20px; top: 50px; color: #DFDDDF; font-weight: 600; font-size: 21px; }
      .you .fill { background: #11324C; border: 2px solid #3AB0D8; }
      .ai .fill { background: linear-gradient(90deg, #1A9FD1, #3AB0D8); }
      .ai .what { color: #EAF6FB; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="1920" data-height="1080">
      <div id="panel" class="clip" data-start="0" data-duration="{{DUR}}" data-track-index="0">
        <div id="ttl">MY RULE</div>
        <div id="big">10 · 80 · 10</div>
        <div class="row you" id="r1"><div class="pct">10%</div><div class="bar"><div class="fill" style="width:30%"></div><div class="who">YOU</div><div class="what">Research · the thinking up front</div></div></div>
        <div class="row ai" id="r2"><div class="pct">80%</div><div class="bar"><div class="fill"></div><div class="who">AI</div><div class="what">The repetitive middle — all of it</div></div></div>
        <div class="row you" id="r3"><div class="pct">10%</div><div class="bar"><div class="fill" style="width:30%"></div><div class="who">YOU</div><div class="what">Taste · creativity · human touch</div></div></div>
      </div>
    </div>
    <script>
      const DUR = {{DUR}}, T1 = {{T1}}, T2 = {{T2}}, T3 = {{T3}};
      gsap.set("#panel", { opacity: 0 });
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#panel", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" }, 0);
      [["#r1", T1], ["#r2", T2], ["#r3", T3]].forEach(([id, t]) => {
        tl.to(id, { opacity: 1, duration: 0.25, ease: "power2.out" }, t)
          .fromTo(id + " .fill", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, t)
          .fromTo(id + " .pct", { scale: 1.3 }, { scale: 1, duration: 0.35, ease: "back.out(2)" }, t);
      });
      tl.to("#panel", { opacity: 0, x: 40, duration: 0.3, ease: "power2.in" }, DUR - 0.3);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
