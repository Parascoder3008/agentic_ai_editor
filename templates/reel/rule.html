<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="reel.css" rel="stylesheet" />
    <script src="reel.js"></script>
  </head>
  <body>
    <!-- reel-rule: A warning chip slams on, then a rule card; an optional toggle switches on (reel-05 beat 9) -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="1080" data-height="1920">
      <div id="fx" class="clip" data-start="0" data-duration="{{DUR}}" data-track-index="0">
        <div id="stage" class="{{BG}}">
          <div class="chip warn" id="chip">{{CHIP}}</div>
          <div class="card" id="card" style="left:120px;top:320px;width:840px;height:520px;text-align:center">
            <div style="margin:56px 40px 0;font-weight:900;font-size:62px;line-height:1.15">{{RULE}}</div>
            <div class="lab" style="margin-top:34px;font-size:30px">{{SUB}}</div>
            <div id="tg" style="position:absolute;left:310px;top:380px;width:220px;height:100px;border-radius:50px;background:#2A333B;border:3px solid #4A5560">
              <div id="kn" style="position:absolute;left:8px;top:8px;width:78px;height:78px;border-radius:50%;background:#DFDDDF"></div>
            </div>
            <div id="tgl" style="position:absolute;left:560px;top:400px;font-weight:900;font-size:44px;color:#8696A0">{{TOGGLE}}</div>
          </div>
        </div>
      </div>
    </div>
    <script>
      const DUR = {{DUR}};
      const tl = gsap.timeline({ paused: true });
      const R = reel(tl, DUR);
      gsap.set(["#chip", "#card"], { opacity: 0 });
      R.slam("#chip", R.at(0.22), 0); R.pop("#card", R.at(0.53), 0.3);
      if (R.$("#tgl").textContent.trim()) {
        tl.to("#kn", { x: 120, backgroundColor: "#FFFFFF", duration: 0.25, ease: "power2.out" }, R.at(0.72))
          .to("#tg", { backgroundColor: "#3DDC97", borderColor: "#3DDC97", duration: 0.2 }, R.at(0.72))
          .to("#tgl", { color: "#3DDC97", duration: 0.2 }, R.at(0.72));
      } else { R.$("#tg").remove(); R.$("#tgl").remove(); }
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
