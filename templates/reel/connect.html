<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="reel.css" rel="stylesheet" />
    <script src="reel.js"></script>
  </head>
  <body>
    <!-- reel-connect: Two real logos joined by a glowing pipe, with data packets running across (reel-05 beat 3) -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="1080" data-height="1920">
      <div id="fx" class="clip" data-start="0" data-duration="{{DUR}}" data-track-index="0">
        <div id="stage" class="{{BG}}">
          <div class="chip" id="chip">{{CHIP}} <small>{{CHIP_SMALL}}</small></div>
          <div class="logo" id="lgA" style="left:110px;top:400px;width:280px;height:280px"><img src="{{LEFT_LOGO}}" /></div>
          <div class="logo" id="lgB" style="left:690px;top:400px;width:280px;height:280px"><img src="{{RIGHT_LOGO}}" /></div>
          <div class="lab" id="tA" style="position:absolute;left:60px;width:380px;top:705px;text-align:center;font-size:34px;color:#FFFFFF">{{LEFT_NAME}}</div>
          <div class="lab" id="tB" style="position:absolute;left:640px;width:380px;top:705px;text-align:center;font-size:34px;color:#FFFFFF">{{RIGHT_NAME}}</div>
          <div id="pipe" style="position:absolute;left:390px;top:532px;width:300px;height:16px;border-radius:8px;background:#3AB0D8;transform-origin:0 50%;box-shadow:0 0 30px rgba(58,176,216,0.8)"></div>
          <div id="pk1" style="position:absolute;left:390px;top:524px;width:32px;height:32px;border-radius:50%;background:#FFFFFF;box-shadow:0 0 24px #FFFFFF"></div>
          <div id="pk2" style="position:absolute;left:390px;top:524px;width:32px;height:32px;border-radius:50%;background:#FFFFFF;box-shadow:0 0 24px #FFFFFF"></div>
        </div>
      </div>
    </div>
    <script>
      const DUR = {{DUR}};
      const tl = gsap.timeline({ paused: true });
      const R = reel(tl, DUR);
      gsap.set(["#chip", "#lgA", "#lgB", "#tA", "#tB", "#pk1", "#pk2"], { opacity: 0 });
      gsap.set("#pipe", { scaleX: 0 });
      R.pop("#lgA", R.at(0.09), 0.3); R.pop("#tA", R.at(0.11), 0.2); R.pop("#lgB", R.at(0.24), 0.3); R.pop("#tB", R.at(0.26), 0.2);
      tl.to("#pipe", { scaleX: 1, duration: 0.35, ease: "power2.out" }, R.at(0.44));
      R.pop("#chip", R.at(0.61));
      for (let t = R.at(0.66), k = 0; t < DUR - 0.45; t += 0.4, k++) {
        const s = k % 2 ? "#pk2" : "#pk1";
        tl.fromTo(s, { opacity: 1, x: 0 }, { x: 268, duration: 0.42, ease: "none", immediateRender: false }, t).set(s, { opacity: 0 }, t + 0.42);
      }
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
