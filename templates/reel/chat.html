<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="reel.css" rel="stylesheet" />
    <script src="reel.js"></script>
  </head>
  <body>
    <!-- reel-chat: WhatsApp-style chat on the stage: messages arrive one by one, typing dots before each reply (reel-05 beat 1) -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="1080" data-height="1920">
      <div id="fx" class="clip" data-start="0" data-duration="{{DUR}}" data-track-index="0">
        <div id="stage" class="{{BG}}">
          <div class="chip" id="chip">{{CHIP}} <small>{{CHIP_SMALL}}</small></div>
          <div class="wa" id="phone" style="left:150px;top:300px;width:780px;height:640px">
            <div class="hd"><div class="av"></div><div class="nm">{{NAME}}</div><div class="st">{{STATUS}}</div></div>
            <div id="list" style="position:absolute;left:0;top:0;width:780px"></div>
            <div class="msg in" id="typ" style="padding:22px 26px"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      const DUR = {{DUR}};
      const tl = gsap.timeline({ paused: true });
      const R = reel(tl, DUR);
      const MSGS = {{MESSAGES}};
      gsap.set(["#chip", "#phone", "#typ"], { opacity: 0 });
      R.pop("#chip", 0.04); R.pop("#phone", 0, 0.22);
      // lay the thread out first (heights depend on the text), then reveal it across the effect
      const list = R.$("#list"), H = 640, rows = [];
      let y = 132;
      MSGS.forEach((m, i) => {
        const el = document.createElement("div");
        el.className = "msg " + (m.from === "out" ? "out" : "in");
        el.textContent = m.text;
        if (m.time) { const tm = document.createElement("span"); tm.className = "tm"; tm.textContent = m.time; el.appendChild(tm); }
        el.style.top = y + "px"; list.appendChild(el); gsap.set(el, { opacity: 0 });
        rows.push({ el, y, out: m.from === "out", slots: [] });
        y += el.offsetHeight + 16;
        if (m.buttons) {
          const w = 250, gap = 20, x0 = (780 - m.buttons.length * w - (m.buttons.length - 1) * gap) / 2;
          m.buttons.forEach((b, j) => {
            const s = document.createElement("div"); s.className = "slot"; s.textContent = b;
            s.style.left = (x0 + j * (w + gap)) + "px"; s.style.top = y + "px"; list.appendChild(s); gsap.set(s, { opacity: 0 });
            rows[rows.length - 1].slots.push({ el: s, picked: j === m.pick });
          });
          y += 76 + 16;
        }
      });
      const t0 = 0.2, step = Math.max(0.25, (DUR - 0.6 - t0) / Math.max(1, MSGS.length - 1));
      rows.forEach((r, i) => {
        const t = i === 0 ? 0 : t0 + step * i;
        const bottom = (i + 1 < rows.length ? rows[i + 1].y : y) + 10;
        if (bottom > H) tl.to(list, { y: H - bottom, duration: 0.25, ease: "power2.out" }, Math.max(0, t - 0.25));
        if (r.out && i > 0) {                       // typing dots just before a reply
          tl.set("#typ", { top: r.y, y: 0 }, Math.max(0, t - 0.3));
          R.pop("#typ", Math.max(0, t - 0.3), 0.15); R.hide("#typ", t - 0.04, 0.04);
          tl.set("#typ", { opacity: 0 }, t);
        }
        if (i === 0) tl.set(r.el, { opacity: 1 }, 0); else R.pop(r.el, t, 0.22);
        r.slots.forEach((s, j) => {
          R.pop(s.el, t + 0.3 + j * 0.15, 0.22);
          if (s.picked) R.press(s.el, Math.min(DUR - 0.3, t + step * 0.8), { backgroundColor: "#25D366", color: "#0B141A" })
            .to(s.el, { backgroundColor: "#25D366", color: "#0B141A", duration: 0.05 }, Math.min(DUR - 0.1, t + step * 0.8 + 0.2));
        });
      });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
