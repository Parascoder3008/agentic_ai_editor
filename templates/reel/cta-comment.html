<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="reel.css" rel="stylesheet" />
    <script src="reel.js"></script>
  </head>
  <body>
    <!-- reel-cta-comment: Instagram CTA: follow, comment a keyword, the guide lands in DM (reel-05 beat 11) -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="1080" data-height="1920">
      <div id="fx" class="clip" data-start="0" data-duration="{{DUR}}" data-track-index="0">
        <div id="stage" class="{{BG}}">
          <div class="btn" id="fol" style="left:330px;top:250px;width:420px;background:#2A333B;color:#FFFFFF">{{FOLLOW}}</div>
          <div class="lab" id="ask" style="position:absolute;left:0;right:0;top:400px;text-align:center;font-size:34px">{{ASK}}</div>
          <div id="kw" style="position:absolute;left:0;right:0;margin:0 auto;top:460px;width:max-content;min-width:520px;max-width:900px;padding:0 60px;height:190px;border-radius:40px;background:#1A9FD1;text-align:center;font-weight:900;font-size:{{SIZE}}px;line-height:190px;white-space:nowrap;box-shadow:0 0 70px rgba(26,159,209,0.6)">{{KEYWORD}}</div>
          <div class="card" id="dm" style="left:190px;top:700px;width:700px;height:120px;text-align:center;padding-top:30px;font-weight:800;font-size:40px">{{DM}}</div>
        </div>
      </div>
    </div>
    <script>
      const DUR = {{DUR}};
      const tl = gsap.timeline({ paused: true });
      const R = reel(tl, DUR);
      gsap.set(["#fol", "#ask", "#kw", "#dm"], { opacity: 0 });
      R.pop("#fol", R.at(0.11)); tl.to("#fol", { backgroundColor: "#1A9FD1", duration: 0.15 }, R.at(0.17));
      R.pop("#ask", R.at(0.3));
      tl.fromTo("#kw", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.5)" }, R.at(0.395))
        .to("#kw", { scale: 1.06, duration: 0.2, yoyo: true, repeat: 1, ease: "sine.inOut" }, R.at(0.49));
      R.pop("#dm", R.at(0.655), 0.3);
      tl.to("#dm", { borderColor: "#3AB0D8", backgroundColor: "rgba(26,159,209,0.25)", duration: 0.2 }, R.at(0.875));
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
