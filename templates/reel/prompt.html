<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="reel.css" rel="stylesheet" />
    <script src="reel.js"></script>
  </head>
  <body>
    <!-- reel-prompt: A prompt typed into an app's message box, then the send button pressed (reel-05 beat 7) -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="1080" data-height="1920">
      <div id="fx" class="clip" data-start="0" data-duration="{{DUR}}" data-track-index="0">
        <div id="stage" class="{{BG}}">
          <div class="chip" id="chip">{{CHIP}} <small>{{CHIP_SMALL}}</small></div>
          <div class="card" id="card" style="left:70px;top:300px;width:940px;height:560px">
            <img id="lg" src="{{LOGO}}" style="position:absolute;left:36px;top:32px;width:64px;height:64px;object-fit:contain" />
            <div id="app" style="position:absolute;left:120px;top:42px;font-weight:900;font-size:40px">{{APP}}</div>
            <div id="ptx" style="position:absolute;left:40px;top:140px;right:40px;font-weight:800;font-size:{{SIZE}}px;line-height:1.3"></div>
            <div id="snd" style="position:absolute;right:36px;bottom:32px;width:92px;height:92px;border-radius:50%;background:#1A9FD1;text-align:center;font-weight:900;font-size:52px;line-height:88px">&#x2191;</div>
          </div>
          <div class="src" id="srcPrompt">{{PROMPT}}</div>
        </div>
      </div>
    </div>
    <script>
      const DUR = {{DUR}};
      const tl = gsap.timeline({ paused: true });
      const R = reel(tl, DUR);
      gsap.set(["#chip", "#card"], { opacity: 0 });
      if (!R.$("#lg").getAttribute("src")) { R.$("#lg").remove(); R.$("#app").style.left = "40px"; }
      R.pop("#chip", R.at(0.027)); R.pop("#card", R.at(0.107), 0.3);
      R.type("#ptx", R.text("#srcPrompt"), R.at(0.29), R.at(0.845));
      R.press("#snd", R.at(0.895), { scale: 0.85, backgroundColor: "#3AB0D8" });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
