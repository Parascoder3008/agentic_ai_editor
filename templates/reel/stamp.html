<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link href="reel.css" rel="stylesheet" />
    <script src="reel.js"></script>
  </head>
  <body>
    <!-- reel-stamp: A rubber-stamp word slammed on at an angle (reel-05: '4 SKILLS', 'AGENT LIVE', 'FREE') -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DUR}}" data-width="1080" data-height="1920">
      <div id="fx" class="clip" data-start="0" data-duration="{{DUR}}" data-track-index="0">
        <div id="st" class="stamp {{COLOR}}" style="left:{{X}}px;top:{{Y}}px;font-size:{{SIZE}}px;background:rgba(10,15,18,0.9)">{{TEXT}}</div>
      </div>
    </div>
    <script>
      const DUR = {{DUR}};
      const tl = gsap.timeline({ paused: true });
      const R = reel(tl, DUR);
      gsap.set("#st", { opacity: 0 });
      R.slam("#st", 0.02, {{ROT}}); R.hide("#st", DUR - 0.1, 0.08);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
